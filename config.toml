[feeds]
# Откуда брать уязвимости: "circl" — CIRCL Vulnerability-Lookup
# (https://vulnerability.circl.lu, объединяет NVD, CVE.org/CISA
# Vulnrichment, GitHub, EUVD и др.) или "nvd" — напрямую из NVD.
cve_source = "circl"
circl_cve_url = "https://vulnerability.circl.lu/api"
# Если CIRCL недоступен, взять CVE из NVD, чтобы не пропустить запуск.
fallback_to_nvd = true
# EPSS и каталог CISA KEV тоже из CIRCL ("circl"); "direct" — напрямую
# из FIRST и CISA. Если CIRCL не ответит, бот возьмёт их напрямую
# (epss_url / kev_url ниже).
epss_source = "circl"
kev_source = "circl"
# Каталог CISA KEV внутри CIRCL Vulnerability-Lookup.
circl_kev_catalog = "405284c2-e461-4670-8979-7fd2c9755a60"
nvd_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
exploitdb_csv_url = "https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv"
# EPSS (вероятность эксплуатации) — включено
epss_url = "https://api.first.org/data/v1/epss"
# CISA KEV (уже эксплуатируются в реальных атаках) — включено
kev_url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

# --- Дополнительные бесплатные базы для подробного описания ----------
# Подключаются только для CVE, по которым уходит сообщение. Любой
# источник можно отключить, удалив строку или оставив пустую "".
# Если источник недоступен, сообщение всё равно отправится без его блока.

# CVE.org: описание и решение от вендора (CNA), затронутые версии,
# CISA Vulnrichment (SSVC) и CVSS, если NVD ещё не посчитал.
# Отключено: та же запись CVE.org (с CISA Vulnrichment) приходит из CIRCL.
# Чтобы запрашивать CVE.org напрямую, верните адрес
# "https://cveawg.mitre.org/api/cve".
cveorg_url = ""
# GitHub Advisory Database: open-source пакеты и версия с исправлением.
ghsa_url = "https://api.github.com/advisories"
# OSV.dev: версии с исправлением по экосистемам и дистрибутивам.
osv_url = "https://api.osv.dev/v1/vulns"
# БДУ ФСТЭК: описание и рекомендации на русском (полная XML-выгрузка).
bdu_url = "https://bdu.fstec.ru/files/documents/vulxml.zip"
# Сертификат НУЦ Минцифры (Russian Trusted Root CA), которым подписан
# bdu.fstec.ru. Workflow скачивает его сам; используется только для БДУ.
bdu_ca_file = "data/russian_trusted_root_ca.pem"
# EUVD (ENISA): европейский идентификатор и отметка об эксплуатации.
euvd_url = "https://euvdservices.enisa.europa.eu/api"
# CIRCL Vulnerability-Lookup: упоминания (sightings) в реальных атаках.
circl_url = "https://vulnerability.circl.lu/api"
