# =====================================================================
#  FreshCVE_Bot / CVE-SIGNAL — конфиг "весь софт, HIGH + CRITICAL"
#  Все уязвимости, опубликованные начиная с 02.11.2026.
#  Источники: NVD + CISA KEV + EPSS + поиск эксплойтов (Exploit-DB, GitHub).
# =====================================================================

[scan]
# Брать ВСЕ CVE, опубликованные с этой даты (UTC). Ограничение
# maximum_cve_age_hours для них не действует.
published_since = "2026-11-02"

# ВЕСЬ софт из NVD: списки technology_keywords / vulnerability_keywords /
# web_cwes ниже игнорируются, работают только severity/CVSS, KEV и
# exclude_keywords. Поставьте false, чтобы фильтровать по вендорам
# (Bitrix, Microsoft и т.д. — списки оставлены ниже).
all_products = true

# Окно сбора. Бот помнит, до какого момента он успешно собрал CVE, и
# каждый запуск читает с этого места (минус запас overlap_minutes), а не
# фиксированные сутки. Так простой расписания не теряет уязвимости.
# lookback_hours — окно только для самого первого запуска (или --since-hours).
lookback_hours = 24
overlap_minutes = 120
# Долгий простой догоняется кусками не больше max_window_hours за запуск,
# но не дальше max_catch_up_days назад.
max_window_hours = 168
max_catch_up_days = 60
maximum_cve_age_hours = 48

# Severity: только HIGH и CRITICAL (по NVD/CVSS). Это строгое условие
# и для CVE из CISA KEV (кроме тех, у которых оценки ещё нет совсем).
severities = ["HIGH", "CRITICAL"]
minimum_cvss = 7.0
maximum_cvss = 10.0

# Фильтр по признакам эксплуатации (сообщение уходит, только если он пройден):
#   "any"  — CVE в CISA KEV ИЛИ EPSS >= minimum_epss
#   "all"  — CVE в CISA KEV И  EPSS >= minimum_epss                     
#   "kev"  — только CISA KEV;  "epss" — только EPSS;  "off" — без фильтра (выбрано)
# CVE, не прошедшие фильтр, бот продолжает отслеживать monitoring_days дней
# и пришлёт сообщение, как только EPSS вырастет или CVE попадёт в KEV.
# У свежих CVE EPSS появляется обычно через ~сутки после публикации.
alert_gate = "off"   # все HIGH/CRITICAL с published_since, без условия KEV/EPSS
minimum_epss = 0.20   # 0.20 = 20%

maximum_exploit_matches = 5

# Следить за найденной CVE 30 дней: первые 48 часов каждые 3 часа,
# потом раз в сутки (если появится PoC — бот ответит на своё сообщение).
monitoring_days = 30
early_recheck_hours = 3
later_recheck_hours = 24

# Лимиты на один запуск (увеличены). Бот сам выдерживает лимиты
# Telegram (~20 сообщений/мин) и GitHub Search (30 запросов/мин);
# таймаут job в GitHub Actions поднят до 120 минут.
github_candidates = 100
github_readme_checks = 15
maximum_cves_per_run = 200

