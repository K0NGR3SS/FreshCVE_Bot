# =====================================================================
#  FreshCVE_Bot / CVE-SIGNAL — конфиг "весь софт, HIGH + CRITICAL"
#  Старт мониторинга: 02.11.2026. Источники: NVD + CISA KEV + EPSS
#  + поиск публичных эксплойтов (Exploit-DB, GitHub).
# =====================================================================
 
[scan]
# Первый запуск заглядывает на 24 часа назад, т.е. захватывает
# все CVE, опубликованные/обновлённые с 02.11.2026. Дальше бот идёт
# по расписанию каждые 3 часа, а уже отправленные CVE повторно
# не шлёт (они помнятся в data/state.sqlite3).
lookback_hours = 24
maximum_cve_age_hours = 48
 
# Severity: HIGH (7.0–8.9) и CRITICAL (9.0–10.0) по CVSS.
# CVE из каталога CISA KEV приходят ВСЕГДА, независимо от CVSS.
minimum_cvss = 7.0
maximum_cvss = 10.0
 
maximum_exploit_matches = 5
 
# Следить за найденной CVE 30 дней: первые 48 часов каждые 3 часа,
# потом раз в сутки (если появится PoC — бот ответит на своё сообщение).
monitoring_days = 30
early_recheck_hours = 3
later_recheck_hours = 24
 
# Лимиты на один запуск. Для "всего софта" поток больше обычного,
# поэтому лимит поднят. Не ставьте выше ~50: упрётесь в 15-минутный
# таймаут GitHub Actions и лимиты поиска GitHub.
github_candidates = 50
github_readme_checks = 10
maximum_cves_per_run = 40
 
# ---------------------------------------------------------------------
# Фильтр: CVE проходит, если совпало хотя бы одно слово из
# technology_keywords И хотя бы одно из vulnerability_keywords / web_cwes
